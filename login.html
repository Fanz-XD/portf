<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Affan Pratangga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('affan-theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if(dark) document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  })();
  // Ganti dua nilai ini dengan URL & anon key dari project Supabase kamu
  // (Project Settings -> API di dashboard Supabase)
  const SUPABASE_URL = 'https://qkbhwlwsergsxpgczvjj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrYmh3bHdzZXJnc3hwZ2N6dmpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyODQwNzUsImV4cCI6MjEwNDg2MDA3NX0.MWCWUTUL1GjBPLVqe_tSBHWzh2R48h3Xm_zFsZYpByI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
</head>
<body>

<header class="auth-header">
  <nav class="wrap">
    <a href="index.html" class="brand">Affan Pratangga</a>
    <button class="tool-btn" id="themeToggle" aria-label="Toggle dark mode" title="Theme">
      <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a href="index.html" class="auth-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Kembali ke portfolio
    </a>
  </nav>
</header>

<main class="auth-main">
  <div class="auth-card">
    <p class="auth-eyebrow">auth/login</p>
    <h1>Selamat datang kembali</h1>
    <p class="auth-sub">Masuk untuk melanjutkan ke akun Anda.</p>

    <form id="loginForm" class="form-card" novalidate>
      <div class="field" id="emailField">
        <input type="email" id="email" placeholder=" " autocomplete="email">
        <label for="email">Alamat email</label>
        <span class="error-msg" id="emailError"></span>
      </div>

      <div class="field" id="passwordField">
        <input type="password" id="password" placeholder=" " autocomplete="current-password">
        <label for="password">Kata sandi</label>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan kata sandi">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <div class="strength-meter"><span id="strengthBar"></span></div>
        <span class="strength-label" id="strengthLabel"></span>
        <span class="error-msg" id="passwordError"></span>
      </div>

      <div class="auth-row">
        <label class="check">
          <input type="checkbox" id="remember">
          <i></i>
          Ingat saya
        </label>
        <a href="#" class="auth-link">Lupa kata sandi?</a>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text">Masuk</span>
        <span class="btn-loader"></span>
        <span class="btn-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5L20 6"/></svg>
        </span>
      </button>
      <p class="form-note" id="formNote"></p>
    </form>

    <p class="auth-foot">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
  </div>
</main>

<script>
  /* ===== Theme toggle (shared key with main site) ===== */
  (function(){
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    const iconPath = document.querySelector('#themeIcon path');
    const SUN = "M12 4V2M12 22v-2M4.93 4.93 3.51 3.51M20.49 20.49l-1.42-1.42M4 12H2m20 0h-2M4.93 19.07l-1.42 1.42M20.49 3.51l-1.42 1.42M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z";
    const MOON = "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z";
    function apply(theme){
      if(theme === 'dark'){ root.setAttribute('data-theme','dark'); } else { root.removeAttribute('data-theme'); }
      if(iconPath) iconPath.setAttribute('d', theme === 'dark' ? SUN : MOON);
      btn.setAttribute('aria-pressed', theme === 'dark');
    }
    btn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(next);
      localStorage.setItem('affan-theme', next);
    });
    apply(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  })();

  /* ===== Password show/hide ===== */
  const password = document.getElementById('password');
  const togglePass = document.getElementById('togglePass');
  const eyeIcon = document.getElementById('eyeIcon');
  const eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeClosed = '<path d="M3 3l18 18"/><path d="M10.6 5.2A11 11 0 0 1 12 5c7 0 11 7 11 7a17 17 0 0 1-3.6 4.4M6.6 6.6C3.9 8.3 2 12 2 12s4 7 11 7c1.4 0 2.7-.3 3.9-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
  togglePass.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    eyeIcon.innerHTML = show ? eyeClosed : eyeOpen;
  });

  /* ===== Password strength ===== */
  const strengthBar = document.getElementById('strengthBar');
  const strengthLabel = document.getElementById('strengthLabel');
  password.addEventListener('input', () => {
    const v = password.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const levels = [
      { pct: 0,   color: 'var(--rule)',  label: '' },
      { pct: 20,  color: '#C0503F',      label: 'Lemah' },
      { pct: 45,  color: '#C0503F',      label: 'Lemah' },
      { pct: 65,  color: 'var(--brass)', label: 'Cukup' },
      { pct: 85,  color: 'var(--accent)',label: 'Kuat' },
      { pct: 100, color: 'var(--accent)',label: 'Sangat kuat' }
    ];
    const lvl = levels[v.length === 0 ? 0 : Math.min(score, 5)];
    strengthBar.style.width = lvl.pct + '%';
    strengthBar.style.background = lvl.color;
    strengthLabel.textContent = v.length === 0 ? '' : lvl.label;
  });

  /* ===== Email validation ===== */
  const emailField = document.getElementById('emailField');
  const email = document.getElementById('email');
  const emailError = document.getElementById('emailError');
  function validateEmail() {
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
    emailField.classList.toggle('has-error', !ok && email.value.length > 0);
    emailField.classList.toggle('is-valid', ok);
    emailError.textContent = (!ok && email.value.length > 0) ? 'Format email belum valid' : '';
    return ok;
  }
  email.addEventListener('input', validateEmail);
  email.addEventListener('blur', validateEmail);

  /* ===== Submit flow (login sungguhan via Supabase) ===== */
  const passwordField = document.getElementById('passwordField');
  const passwordError = document.getElementById('passwordError');
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const remember = document.getElementById('remember');
  const formNote = document.getElementById('formNote');

  function shake(){
    form.classList.remove('shake');
    void form.offsetWidth;
    form.classList.add('shake');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const emailOk = validateEmail();
    const passOk = password.value.length >= 6;

    passwordField.classList.toggle('has-error', !passOk);
    passwordError.textContent = passOk ? '' : 'Kata sandi minimal 6 karakter';

    if (!emailOk || !passOk) { shake(); return; }

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;
    passwordError.textContent = '';
    formNote.textContent = '';

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email.value.trim(),
      password: password.value
    });

    submitBtn.classList.remove('loading');

    if (error) {
      submitBtn.disabled = false;
      passwordField.classList.add('has-error');
      passwordError.textContent =
        error.message === 'Invalid login credentials'
          ? 'Email atau kata sandi salah'
          : error.message;
      shake();
      return;
    }

    // Supabase otomatis menyimpan sesi di localStorage (bertahan meski tab ditutup).
    // "Ingat saya" di sini hanya menandai preferensi tambahan, karena sesi Supabase
    // sudah persist secara default.
    if (remember.checked) localStorage.setItem('rememberMe', 'true');

    submitBtn.classList.add('success');
    formNote.textContent = 'Berhasil masuk. Mengalihkan…';
    setTimeout(() => { window.location.href = 'index.html'; }, 700);
  });
</script>

</body>
</html>
